<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>User Management</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background: #1a2b3c;
      color: white;
    }

    h1 { margin-bottom: 20px; }

    .toolbar {
      margin-bottom: 15px;
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    .toolbar button {
      padding: 8px 14px;
      border: none;
      border-radius: 5px;
      color: white;
      cursor: pointer;
    }

    .btn-create { background-color: #28c76f; }
    .btn-refresh { background-color: #00cfe8; }

    table {
      width: 100%;
      border-collapse: collapse;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
      background: #2c3e50;
    }

    th, td {
      padding: 12px;
      border-bottom: 1px solid #555;
      text-align: left;
      vertical-align: middle;
    }

    th { background: #34495e; }
    .active-icon { color: #28c76f; font-size: 18px; }

    .footer {
      padding: 10px;
      font-size: 14px;
      color: #ccc;
    }

    /* Modal */
    .modal {
      display: none;
      position: fixed;
      z-index: 2000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.6);
    }

    .modal-content {
      background: #2c3e50;
      margin: 4vh auto;
      padding: 16px 16px 14px 16px;
      border-radius: 10px;
      width: 760px;
      max-width: 92vw;
      max-height: 88vh;
      overflow: hidden; /* Scroll nur im Body */
      box-shadow: 0 4px 10px rgba(0,0,0,0.45);
    }

    .modal-header {
      font-weight: bold;
      font-size: 18px;
      margin-bottom: 10px;
    }

    /* Scrollbarer Bereich */
    .modal-body {
      max-height: calc(88vh - 70px); /* Platz für Header + Buttons */
      overflow: auto;
      padding-right: 6px;
    }

    /* Bild oben mittig, Button rechts davon */
    .image-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 14px;
      margin: 10px 0 18px 0;
    }

    .modal-image {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      object-fit: cover;
      margin: 0;
      background: #1a2b3c;
    }

    .btn-change-image {
      padding: 6px 12px;
      border: none;
      border-radius: 6px;
      background: #00cfe8;
      color: white;
      cursor: pointer;
      font-size: 14px;
      margin: 0;
      white-space: nowrap;
    }
    .btn-change-image:hover { background: #0099b8; }

    /* 2 Spalten: links Felder, rechts Rechte (unterhalb des Bildes) */
    .modal-grid {
      display: grid;
      grid-template-columns: 1fr 280px;
      gap: 26px;
      align-items: start;
    }

    .modal label {
      display: block;
      margin: 10px 0 6px 0;
      font-size: 14px;
    }

    .modal input[type="text"],
    .modal input[type="password"],
    .modal input[type="number"],
    .modal select {
      width: 320px;
      max-width: 100%;
      display: block;
      margin: 0 0 10px 0;
      padding: 7px 8px;
      border-radius: 6px;
      border: 1px solid #556;
      background: #1a2b3c;
      color: white;
      outline: none;
      box-sizing: border-box;
    }

    .modal select { cursor: pointer; }

    .modal-right-title {
      font-weight: bold;
      font-size: 14px;
      margin: 10px 0 10px 0;
      opacity: 0.95;
    }

    .modal-checkboxes {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .right-item {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      line-height: 1.2;
      white-space: nowrap;
    }

    .right-item input[type="checkbox"] {
      width: auto;
      display: inline-block;
      margin: 0;
      padding: 0;
      transform: scale(1.15);
      cursor: pointer;
      accent-color: #00cfe8;
    }

    .modal-buttons {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 12px;
    }

    .btn-cancel, .btn-save {
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      color: white;
      font-size: 14px;
    }

    .btn-cancel { background: #ea5455; }
    .btn-save { background: #28c76f; }

    @media (max-width: 820px) {
      .modal-grid { grid-template-columns: 1fr; }
      .modal-right-title { margin-top: 18px; }
      .right-item { white-space: normal; }
    }
  </style>
</head>

<body>
  <h1>Benutzer Management</h1>

  <div class="toolbar">
    <button class="btn-create" id="btnCreate">Benutzer erstellen</button>
    <button class="btn-refresh" id="btnRefresh">Aktualisieren</button>
  </div>

  <table>
    <thead>
      <tr>
        <th>Profil</th>
        <th>Benutzername</th>
        <th>Aktiv</th>
        <th>Rolle</th>
        <th>Rechte</th>
        <th>Aktionen</th>
      </tr>
    </thead>
    <tbody id="user-table"></tbody>
  </table>

  <div class="footer" id="user-count"></div>

  <!-- Modal -->
  <div id="editModal" class="modal">
    <div class="modal-content">
      <div class="modal-header" id="modalTitle">Benutzer bearbeiten</div>

      <div class="modal-body">
        <div class="image-row">
          <img id="modal-profil-image" class="modal-image" alt="Profilbild" />
          <button id="btnChangeImage" class="btn-change-image">Bild ändern</button>
          <input id="imageFile" type="file" accept="image/*" style="display:none">
        </div>

        <div class="modal-grid">
          <div class="modal-left">
            <label>Benutzername</label>
            <input type="text" id="edit-username" />

            <label id="labelPinAlt">aktueller PIN</label>
            <input type="text" id="edit-pin" />

            <label>neuer PIN</label>
            <input type="text" id="edit-neu-pin-1" />

            <label>PIN wiederholung</label>
            <input type="text" id="edit-neu-pin-2" />

            <label>Rolle</label>
            <select id="edit-role"></select>
          </div>

          <div class="modal-right">
            <div class="modal-right-title">Rechte</div>
            <div class="modal-checkboxes" id="rechte-container"></div>
          </div>
        </div>
      </div>

      <div class="modal-buttons">
        <button class="btn-cancel" id="btnCancel">Abbrechen</button>
        <button class="btn-save" id="btnSave">Speichern</button>
      </div>
    </div>
  </div>

  <script>
    // ===========================
    // KONFIG
    // ===========================
    const DATA_DIR = "user";   // <- HIER ändern: z.B. "data" oder "web/config"

    // Rechte-Texte (wenn in rols.json r1..r10 ist, dann 10 Einträge)
    const rechteTexte = [
      "Rezepte",
      "Auswertung",
      "Auswertung zurücksetzen",
      "Reinigung",
      "System",
      "WiFi",
      "Kanäle verwalten",
      "Benutzer verwalten",
      "Recht 9",
      "Recht 10",
    ];

    // localStorage Key
    const LS_KEY = "um_state_v3";

    // ===========================
    // STATE
    // ===========================
    let users = [];
    let roles = [];
    let currentUser = null;

    const userTable = document.getElementById("user-table");
    const userCount = document.getElementById("user-count");

    // ===========================
    // HELPERS
    // ===========================
    function escapeHtml(s) {
      return String(s ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function saveToLocalStorage() {
      try {
        // Wichtig: pictureDataUrl NICHT speichern (zu groß -> QuotaExceeded)
        const safeUsers = users.map(u => {
          const { pictureDataUrl, __isNew, ...rest } = u;
          return rest;
        });

        // Rollen ändern sich selten -> kann man mitspeichern, ist klein
        localStorage.setItem(LS_KEY, JSON.stringify({ users: safeUsers, roles }));
      } catch (e) {
        console.warn("localStorage speichern fehlgeschlagen:", e);

        // Optional: einmalige Info (nicht nervig spammen)
        if (!window.__lsWarned) {
          window.__lsWarned = true;
          alert("Hinweis: Speichern im Browser (localStorage) ist deaktiviert oder voll.\nÄnderungen bleiben bis zum Reload sichtbar, werden aber nicht dauerhaft gespeichert.");
        }
      }
    }

    function loadFromLocalStorage() {
      try {
        const raw = localStorage.getItem(LS_KEY);
        if (!raw) return null;
        const parsed = JSON.parse(raw);

        // pictureDataUrl existiert dann nicht mehr -> ist okay
        return parsed;
      } catch {
        return null;
      }
    }

    function roleIndexToName(roleIndex) {
      const r = roles[roleIndex - 1];
      return r ? r.name : "Unbekannt";
    }

    function roleIndexToRights(roleIndex) {
      const r = roles[roleIndex - 1];
      if (!r) return new Array(rechteTexte.length).fill(false);

      const out = [];
      for (let i = 1; i <= rechteTexte.length; i++) {
        out.push(!!r["r" + i]);
      }
      return out;
    }

    function countRights(arr) {
      return arr.filter(Boolean).length;
    }

    function getUserImage(user) {
      return user.pictureDataUrl || user.picture || "";
    }

    function genId() {
      // simple ID (später durch echte ersetzen)
      return "U" + Date.now().toString(16).toUpperCase();
    }

    // ===========================
    // LOAD DATA
    // ===========================
    async function loadData({ ignoreCache = false } = {}) {
      if (!ignoreCache) {
        const cached = loadFromLocalStorage();
        if (cached?.users?.length && cached?.roles?.length) {
          users = cached.users;
          roles = cached.roles;
          return;
        }
      }

      const usersPath = `${DATA_DIR}/users.json`;
      const rolesPath = `${DATA_DIR}/rols.json`;

      try {
        const [uRes, rRes] = await Promise.all([
          fetch(usersPath, { cache: "no-store" }),
          fetch(rolesPath, { cache: "no-store" }),
        ]);

        const uJson = await uRes.json();
        const rJson = await rRes.json();

        roles = rJson.roles || [];

        // Erwartet: uJson.user = [...]
        users = (uJson.user || []).map(u => {
          const roleIndex = Number(u.role ?? 1);
          const rights = roleIndexToRights(roleIndex);

          return {
            nr: u.nr ?? null,
            username: u.name ?? u.username ?? "",
            id: u.id ?? genId(),
            PIN: String(u.pin ?? ""),
            roleIndex,
            picture: u.picture ?? "",
            pictureDataUrl: null,

            rechteOverride: null,
            rechte: rights,
            anzahl_rechte: countRights(rights),

            active: true
          };
        });

        saveToLocalStorage();
      } catch (e) {
        console.warn("Konnte JSON nicht laden (Fallback aktiv):", e);

        // Fallback Rollen
        roles = [
          { name: "Admin", r1:1,r2:1,r3:1,r4:1,r5:1,r6:1,r7:1,r8:1,r9:1,r10:1 },
          { name: "Benutzer", r1:1,r2:0,r3:0,r4:1,r5:0,r6:0,r7:0,r8:0,r9:0,r10:0 }
        ];

        // Fallback Users
        users = [
          {
            nr: 1, username: "Admin", id: "ADMIN", PIN: "1111",
            roleIndex: 1, picture: "", pictureDataUrl: null,
            rechteOverride: null, rechte: roleIndexToRights(1),
            anzahl_rechte: 10, active: true
          }
        ];
      }
    }

    async function refreshFromJson() {
      // Cache löschen und neu laden
      try { localStorage.removeItem(LS_KEY); } catch {}
      await loadData({ ignoreCache: true });
      renderUsers();
    }

    // ===========================
    // RENDER TABLE
    // ===========================
    function renderUsers() {
      userTable.innerHTML = "";

      users.forEach((user, index) => {
        const roleName = roleIndexToName(user.roleIndex);
        const img = getUserImage(user);

        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>
            <img src="${img}" style="width:80px; height:80px; border-radius:50%; object-fit:cover; background:#1a2b3c;" alt="Profilbild">
          </td>
          <td>${escapeHtml(user.username)}</td>
          <td>${user.active ? '<span class="active-icon">✔</span>' : ""}</td>
          <td>${escapeHtml(roleName)}</td>
          <td>${user.anzahl_rechte}/${rechteTexte.length}</td>
          <td class="actions">
            <button class="edit" data-index="${index}"
              style="background:#00cfe8;border:none;border-radius:6px;padding:6px 10px;color:white;cursor:pointer;">
              Bearbeiten
            </button>
            ${roleName !== "Admin" ? `
              <button class="delete" data-index="${index}"
                style="background:#ea5455;border:none;border-radius:6px;padding:6px 10px;color:white;cursor:pointer;">
                Löschen
              </button>` : ""}
          </td>
        `;
        userTable.appendChild(tr);
      });

      document.querySelectorAll(".edit").forEach(btn => {
        btn.addEventListener("click", () => {
          const idx = Number(btn.getAttribute("data-index"));
          openModal(users[idx], { isNew: false });
        });
      });

      document.querySelectorAll(".delete").forEach(btn => {
        btn.addEventListener("click", () => {
          const idx = Number(btn.getAttribute("data-index"));
          const u = users[idx];
          if (confirm(`User "${u.username}" wirklich löschen?`)) {
            users.splice(idx, 1);
            saveToLocalStorage();
            renderUsers();
          }
        });
      });

      userCount.textContent = `${users.length} user(s) in total`;
    }

    // ===========================
    // MODAL / RIGHTS
    // ===========================
    function renderRights(rightsArr) {
      const container = document.getElementById("rechte-container");
      container.innerHTML = "";

      rechteTexte.forEach((text, i) => {
        const label = document.createElement("label");
        label.className = "right-item";
        label.innerHTML = `<input type="checkbox" id="recht-${i+1}"><span>${escapeHtml(text)}</span>`;

        const cb = label.querySelector("input");
        cb.checked = !!rightsArr[i];

        cb.addEventListener("change", () => {
          if (!currentUser) return;

          const newRights = rechteTexte.map((_, idx) => {
            const el = document.getElementById("recht-" + (idx + 1));
            return !!el?.checked;
          });

          currentUser.rechteOverride = newRights;
          currentUser.rechte = newRights;
          currentUser.anzahl_rechte = countRights(newRights);
        });

        container.appendChild(label);
      });
    }

    function fillRoleSelect(selectedIndex) {
      const sel = document.getElementById("edit-role");
      sel.innerHTML = "";
      roles.forEach((r, i) => {
        const opt = document.createElement("option");
        opt.value = String(i + 1); // 1-based
        opt.textContent = r.name;
        sel.appendChild(opt);
      });
      sel.value = String(selectedIndex);
    }

    function openModal(user, { isNew }) {
      currentUser = user;
      currentUser.__isNew = !!isNew;

      // Titel + PIN-Label
      document.getElementById("modalTitle").textContent = isNew ? "Benutzer erstellen" : "Benutzer bearbeiten";
      document.getElementById("labelPinAlt").textContent = isNew ? "aktueller PIN (bei neuem User nicht nötig)" : "aktueller PIN";

      // Bild
      document.getElementById("modal-profil-image").src = getUserImage(user) || "";

      // Inputs
      document.getElementById("edit-username").value = user.username || "";
      document.getElementById("edit-pin").value = "";
      document.getElementById("edit-neu-pin-1").value = "";
      document.getElementById("edit-neu-pin-2").value = "";

      // Rollen
      fillRoleSelect(user.roleIndex);

      // Rechte
      const showRights = user.rechteOverride ? [...user.rechteOverride] : roleIndexToRights(user.roleIndex);
      user.rechte = showRights;
      user.anzahl_rechte = countRights(showRights);
      renderRights(showRights);

      // Rolle geändert => preset & override löschen
      const sel = document.getElementById("edit-role");
      sel.onchange = () => {
        const newRoleIndex = Number(sel.value);
        currentUser.roleIndex = newRoleIndex;
        currentUser.rechteOverride = null;

        const preset = roleIndexToRights(newRoleIndex);
        currentUser.rechte = preset;
        currentUser.anzahl_rechte = countRights(preset);
        renderRights(preset);
      };

      document.getElementById("editModal").style.display = "block";
    }

    function closeModal() {
      document.getElementById("editModal").style.display = "none";
      currentUser = null;
    }

    // ===========================
    // SAVE USER
    // ===========================
    function saveUser() {
      if (!currentUser) return;

      const isNew = !!currentUser.__isNew;

      // Username
      const newName = document.getElementById("edit-username").value.trim();
      if (!newName) {
        alert("Bitte Benutzername eingeben.");
        return;
      }
      currentUser.username = newName;

      // Rolle
      currentUser.roleIndex = Number(document.getElementById("edit-role").value);

      // Rechte final
      const finalRights = currentUser.rechteOverride ? currentUser.rechteOverride : roleIndexToRights(currentUser.roleIndex);
      currentUser.rechte = finalRights;
      currentUser.anzahl_rechte = countRights(finalRights);

      // PIN Logik:
      const gespeicherterPin = String(currentUser.PIN ?? "");
      const inputPin = document.getElementById("edit-pin").value.trim();
      const neuPin1 = document.getElementById("edit-neu-pin-1").value.trim();
      const neuPin2 = document.getElementById("edit-neu-pin-2").value.trim();

      // Wenn neuer PIN eingetragen wurde -> prüfen
      if (neuPin1 || neuPin2) {
        if (neuPin1 !== neuPin2) {
          alert("Neuer PIN und Wiederholung stimmen nicht überein.");
          return;
        }
        if (!neuPin1) {
          alert("Neuer PIN darf nicht leer sein.");
          return;
        }

        // Beim Bearbeiten: aktueller PIN muss stimmen
        if (!isNew && inputPin !== gespeicherterPin) {
          alert("Aktueller PIN ist falsch.");
          return;
        }

        // Beim Anlegen: aktueller PIN ist egal
        currentUser.PIN = neuPin1;
      } else {
        // Beim Anlegen muss ein PIN gesetzt werden
        if (isNew && !gespeicherterPin) {
          alert("Bitte einen PIN setzen (Neuer PIN + Wiederholung).");
          return;
        }
      }

      // Falls neu: erst jetzt in die users-Liste übernehmen
      if (isNew) {
        delete currentUser.__isNew;

        // Auto-ID, wenn leer
        if (!currentUser.id) currentUser.id = genId();

        // nr automatisch
        if (currentUser.nr == null) {
          currentUser.nr = (users.at(-1)?.nr ?? users.length) + 1;
        }

        users.push(currentUser);
      } else {
        delete currentUser.__isNew;
      }

      saveToLocalStorage();
      renderUsers();
      closeModal();
    }

    // ===========================
    // CREATE USER (DRAFT)
    // ===========================
    function createUser() {
      const defaultRole = 1;
      const preset = roleIndexToRights(defaultRole);

      const draftUser = {
        nr: null,
        username: "Neuer Benutzer",
        id: "",
        PIN: "",                 // beim Anlegen wird PIN über "neuer PIN" gesetzt
        roleIndex: defaultRole,
        picture: "",
        pictureDataUrl: null,

        rechteOverride: null,
        rechte: preset,
        anzahl_rechte: countRights(preset),

        active: true
      };

      openModal(draftUser, { isNew: true });
    }

    // ===========================
    // IMAGE CHANGE
    // ===========================
    function setupImageChange() {
      const btn = document.getElementById("btnChangeImage");
      const fileInput = document.getElementById("imageFile");

      btn.addEventListener("click", () => fileInput.click());

      fileInput.addEventListener("change", () => {
        const file = fileInput.files && fileInput.files[0];
        if (!file) return;

        if (!file.type.startsWith("image/")) {
          alert("Bitte ein Bild auswählen.");
          fileInput.value = "";
          return;
        }

        const reader = new FileReader();
        reader.onload = () => {
          if (!currentUser) return;
          currentUser.pictureDataUrl = reader.result;

          document.getElementById("modal-profil-image").src = currentUser.pictureDataUrl;

          // direkt sichtbar in Tabelle (auch ohne Speichern ok, kann man aber ändern)
          renderUsers();
        };
        reader.readAsDataURL(file);

        fileInput.value = "";
      });
    }

    // ===========================
    // EVENTS / INIT
    // ===========================
    window.onclick = (event) => {
      const modal = document.getElementById("editModal");
      if (event.target === modal) closeModal();
    };

    document.getElementById("btnCancel").addEventListener("click", closeModal);
    document.getElementById("btnSave").addEventListener("click", saveUser);
    document.getElementById("btnCreate").addEventListener("click", createUser);
    document.getElementById("btnRefresh").addEventListener("click", refreshFromJson);

    (async function init() {
      await loadData();
      setupImageChange();
      renderUsers();
    })();
  </script>
</body>
</html>
